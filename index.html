
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#0f172a" id="theme-color-meta" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ph_sec_theme_dark_v1');
          var isDark =
            saved !== null
              ? saved === 'true'
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          var meta = document.getElementById('theme-color-meta');
          if (isDark) {
            root.classList.add('dark');
            root.style.backgroundColor = '#0f172a';
            root.style.colorScheme = 'dark';
            if (meta) meta.setAttribute('content', '#0f172a');
          } else {
            root.classList.remove('dark');
            root.style.backgroundColor = '#ffffff';
            root.style.colorScheme = 'light';
            if (meta) meta.setAttribute('content', '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="apple-mobile-web-app-title" content="SEC Docs" />

    <!-- PWA icons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./icon.svg"
    />

    
    <meta
      name="description"
      content="Automated generator for Philippine SEC corporate dissolution documents in Microsoft Word format."
    />

    <title>SEC Dissolution Word Doc Generator</title>
  </head>

  <body>
    <div id="root"></div>

    <!-- Keep only this entry script. Vite handles the production base path. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
